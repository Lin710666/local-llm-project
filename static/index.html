
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Local AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f8;
      color: #222;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 24px;
      background: white;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    .status {
      color: #15803d;
      font-size: 13px;
    }

    #chat {
      flex: 1;
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      padding: 24px;
      overflow-y: auto;
    }

    .welcome {
      text-align: center;
      margin-top: 15vh;
      color: #555;
    }

    .welcome h2 {
      color: #222;
    }

    .message {
      margin: 22px 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .role {
      font-size: 12px;
      color: #777;
      font-weight: bold;
      text-transform: uppercase;
    }

    .bubble {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.65;
      padding: 14px 16px;
      border-radius: 12px;
      max-width: 100%;
    }

    .user .bubble {
      background: #e8efff;
    }

    .assistant .bubble {
      background: white;
      border: 1px solid #e8e8e8;
    }

    footer {
      background: #f7f7f8;
      padding: 14px 20px 20px;
    }

    #form {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: white;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 10px;
    }

    #input {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      font: inherit;
      padding: 9px;
      max-height: 160px;
      min-height: 42px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 12px 16px;
      cursor: pointer;
      background: #222;
      color: white;
      font-size: 14px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #clear {
      background: #eee;
      color: #333;
    }

    .hint {
      text-align: center;
      font-size: 12px;
      color: #888;
      margin: 10px 0 0;
    }

    @media (max-width: 600px) {
      #chat {
        padding: 16px;
      }

      header {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>My Local AI</h1>
    <div>
      <span class="status">● Local model</span>
      <button id="clear" type="button">New chat</button>
    </div>
  </header>

  <main id="chat" aria-live="polite">
    <div class="welcome" id="welcome">
      <h2>What would you like to learn?</h2>
      <p>Ask a question and chat with your local AI.</p>
    </div>
  </main>

  <footer>
    <form id="form">
      <textarea
        id="input"
        rows="1"
        placeholder="Message your AI..."
        aria-label="Your message"
        required
      ></textarea>
      <button id="send" type="submit">Send</button>
    </form>
    <p class="hint">
      Responses are generated by your local model.
    </p>
  </footer>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const clear = document.getElementById("clear");
    const welcome = document.getElementById("welcome");

    // Conversation history lives in the browser.
    const messages = [];
    let busy = false;

    function addMessage(role, content = "") {
      const wrapper = document.createElement("div");
      wrapper.className = `message ${role}`;

      const label = document.createElement("div");
      label.className = "role";
      label.textContent = role === "user" ? "You" : "AI";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = content;

      wrapper.append(label, bubble);
      chat.appendChild(wrapper);
      chat.scrollTop = chat.scrollHeight;

      return bubble;
    }

    function scrollToBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage(text) {
      if (busy || !text.trim()) return;

      busy = true;
      send.disabled = true;
      clear.disabled = true;
      input.disabled = true;
      welcome.hidden = true;

      messages.push({
        role: "user",
        content: text
      });

      addMessage("user", text);
      const answerBubble = addMessage("assistant", "");

      let answer = "";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ messages })
        });

        if (!response.ok) {
          throw new Error(`Server returned HTTP ${response.status}`);
        }

        if (!response.body) {
          throw new Error("Streaming is not supported by this response.");
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        function processLine(line) {
          if (!line.trim()) return;

          const item = JSON.parse(line);

          if (item.error) {
            throw new Error(item.error);
          }

          const piece = item.message?.content || "";
          answer += piece;
          answerBubble.textContent = answer;
          scrollToBottom();
        }

        while (true) {
          const { value, done } = await reader.read();

          buffer += decoder.decode(
            value || new Uint8Array(),
            { stream: !done }
          );

          const lines = buffer.split("\n");
          buffer = lines.pop() || "";

          for (const line of lines) {
            processLine(line);
          }

          if (done) break;
        }

        if (buffer.trim()) {
          processLine(buffer);
        }

        messages.push({
          role: "assistant",
          content: answer
        });

      } catch (error) {
        answerBubble.textContent = "Error: " + error.message;

        // Don't keep an unanswered request in history.
        if (messages.length &&
            messages[messages.length - 1].role === "user") {
          messages.pop();
        }

      } finally {
        busy = false;
        send.disabled = false;
        clear.disabled = false;
        input.disabled = false;
        input.focus();
        scrollToBottom();
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const text = input.value.trim();
      if (!text || busy) return;

      input.value = "";
      input.style.height = "auto";
      sendMessage(text);
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height =
        Math.min(input.scrollHeight, 160) + "px";
    });

    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    clear.addEventListener("click", () => {
      if (busy) return;

      messages.length = 0;

      chat.querySelectorAll(".message").forEach(
        element => element.remove()
      );

      welcome.hidden = false;
      input.focus();
    });
  </script>
</body>
</html>
